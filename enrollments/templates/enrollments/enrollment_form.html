{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirm Enrollment</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to enroll in:</p>
                <h3 class="text-primary">{{ course.title }}</h3>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success btn-lg px-5">Confirm</button>
                    <a href="{% url 'courses:detail' course.id %}" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
